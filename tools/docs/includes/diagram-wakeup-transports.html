<div class="lq-diagram lq-diagram--transports">
  <svg viewBox="0 0 920 270" role="img" aria-labelledby="lq-tr-title lq-tr-desc">
    <title id="lq-tr-title">Transport Layers in Litestar Queues</title>
    <desc id="lq-tr-desc">Architectural boundary between Authoritative Task Storage, Worker Wakeup Hints, Execution Dispatch Transports, and Browser Event Fan-Out.</desc>

    <rect x="16" y="20" width="212" height="230" rx="12" fill="var(--lq-card)" stroke="var(--lq-amber)" stroke-width="2" />
    <text x="122" y="50" text-anchor="middle" fill="var(--lq-text)" font-size="13.5" font-weight="700">Task Storage</text>
    <text x="122" y="72" text-anchor="middle" fill="var(--lq-amber)" font-size="11" font-family="monospace">BaseQueueBackend</text>
    <text x="122" y="98" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">Sole source of truth for</text>
    <text x="122" y="114" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">QueuedTaskRecord state</text>
    <text x="122" y="142" text-anchor="middle" fill="var(--lq-text)" font-size="10.5" font-weight="600">Backends:</text>
    <text x="122" y="160" text-anchor="middle" fill="var(--lq-muted)" font-size="10">• SQLSpec (11 dialects)</text>
    <text x="122" y="176" text-anchor="middle" fill="var(--lq-muted)" font-size="10">• Advanced Alchemy</text>
    <text x="122" y="192" text-anchor="middle" fill="var(--lq-muted)" font-size="10">• Redis 8.1+ / Valkey 6+</text>
    <text x="122" y="208" text-anchor="middle" fill="var(--lq-muted)" font-size="10">• Ephemeral / InMemory</text>

    <rect x="244" y="20" width="212" height="230" rx="12" fill="var(--lq-card)" stroke="var(--lq-blue)" stroke-width="2" />
    <text x="350" y="50" text-anchor="middle" fill="var(--lq-text)" font-size="13.5" font-weight="700">Worker Wakeups</text>
    <text x="350" y="72" text-anchor="middle" fill="var(--lq-blue)" font-size="11" font-family="monospace">wakeup_transport</text>
    <text x="350" y="98" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">Low-latency hint to wake</text>
    <text x="350" y="114" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">idle polling workers</text>
    <text x="350" y="142" text-anchor="middle" fill="var(--lq-text)" font-size="10.5" font-weight="600">Transports:</text>
    <text x="350" y="160" text-anchor="middle" fill="var(--lq-muted)" font-size="10">• notify_queue / notify (PG)</text>
    <text x="350" y="176" text-anchor="middle" fill="var(--lq-muted)" font-size="10">• aq / txeventq (Oracle)</text>
    <text x="350" y="192" text-anchor="middle" fill="var(--lq-muted)" font-size="10">• poll_queue (SQLite/MySQL)</text>
    <text x="350" y="208" text-anchor="middle" fill="var(--lq-muted)" font-size="10">• Redis/Valkey Pub/Sub</text>

    <rect x="472" y="20" width="212" height="230" rx="12" fill="var(--lq-card)" stroke="var(--lq-violet)" stroke-width="2" />
    <text x="578" y="50" text-anchor="middle" fill="var(--lq-text)" font-size="13.5" font-weight="700">Execution Dispatch</text>
    <text x="578" y="72" text-anchor="middle" fill="var(--lq-violet)" font-size="11" font-family="monospace">BaseExecutionBackend</text>
    <text x="578" y="98" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">Carries ID-only envelope</text>
    <text x="578" y="114" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">{"version": 1, "task_id"}</text>
    <text x="578" y="142" text-anchor="middle" fill="var(--lq-text)" font-size="10.5" font-weight="600">Backends:</text>
    <text x="578" y="160" text-anchor="middle" fill="var(--lq-muted)" font-size="10">• Local / Immediate</text>
    <text x="578" y="176" text-anchor="middle" fill="var(--lq-muted)" font-size="10">• Cloud Tasks (HTTP OIDC)</text>
    <text x="578" y="192" text-anchor="middle" fill="var(--lq-muted)" font-size="10">• Cloud Run Jobs</text>
    <text x="578" y="208" text-anchor="middle" fill="var(--lq-muted)" font-size="10">• Pub/Sub • SQS • RMQ • Kafka</text>

    <rect x="700" y="20" width="204" height="230" rx="12" fill="var(--lq-card)" stroke="var(--lq-emerald)" stroke-width="2" />
    <text x="802" y="50" text-anchor="middle" fill="var(--lq-text)" font-size="13.5" font-weight="700">Browser Fan-Out</text>
    <text x="802" y="72" text-anchor="middle" fill="var(--lq-emerald)" font-size="11" font-family="monospace">QueueEventsConfig</text>
    <text x="802" y="98" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">Streams live QueueEvents</text>
    <text x="802" y="114" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">&amp; replays QueueEventLog</text>
    <text x="802" y="142" text-anchor="middle" fill="var(--lq-text)" font-size="10.5" font-weight="600">Delivery:</text>
    <text x="802" y="160" text-anchor="middle" fill="var(--lq-muted)" font-size="10">• ChannelsQueueEventSink</text>
    <text x="802" y="176" text-anchor="middle" fill="var(--lq-muted)" font-size="10">• /queues/events/sse (SSE)</text>
    <text x="802" y="192" text-anchor="middle" fill="var(--lq-muted)" font-size="10">• /queues/events (WS)</text>
    <text x="802" y="208" text-anchor="middle" fill="var(--lq-muted)" font-size="10">• QueueEventLog replay</text>
  </svg>
</div>
