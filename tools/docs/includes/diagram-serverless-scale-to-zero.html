<div class="lq-diagram lq-diagram--serverless">
  <style>
    .lq-diagram--serverless .lq-sls-panel {
      display: none;
    }
    #lq-sls-lanes:checked ~ .lq-diagram-tabs label[for="lq-sls-lanes"],
    #lq-sls-maint:checked ~ .lq-diagram-tabs label[for="lq-sls-maint"] {
      border-color: var(--lq-blue);
      background: rgba(37, 99, 235, 0.12);
      color: var(--lq-blue);
    }
    #lq-sls-lanes:checked ~ .lq-sls-panels .lq-sls-panel--lanes,
    #lq-sls-maint:checked ~ .lq-sls-panels .lq-sls-panel--maint {
      display: block;
    }
  </style>

  <input type="radio" name="lq-serverless-tab" id="lq-sls-lanes" checked />
  <input type="radio" name="lq-serverless-tab" id="lq-sls-maint" />

  <div class="lq-diagram-tabs" role="tablist" aria-label="Serverless Scale-to-Zero Architecture">
    <label for="lq-sls-lanes">Multi-Backend Push &amp; Batch Lanes</label>
    <label for="lq-sls-maint">Six-Phase Maintenance Sweep</label>
  </div>

  <div class="lq-sls-panels">
    <div class="lq-sls-panel lq-sls-panel--lanes">
      <svg viewBox="0 0 920 265" role="img" aria-labelledby="lq-sls-ln-title lq-sls-ln-desc">
        <title id="lq-sls-ln-title">Serverless Scale-to-Zero Dual-Lane Dispatch</title>
        <desc id="lq-sls-ln-desc">QueueConfig routes interactive tasks (&lt;= 30m) to CloudTasksExecutionConfig push webhooks and heavy batch tasks to CloudRunExecutionConfig one-shot Job containers.</desc>

        <rect x="16" y="42" width="235" height="180" rx="12" fill="var(--lq-card)" stroke="var(--lq-blue)" stroke-width="2" />
        <text x="133" y="72" text-anchor="middle" fill="var(--lq-text)" font-size="14" font-weight="700">Multi-Backend Router</text>
        <text x="133" y="96" text-anchor="middle" fill="var(--lq-blue)" font-size="11.5" font-family="monospace">QueueConfig</text>
        <text x="133" y="120" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">execution_backend = CloudTasks</text>
        <text x="133" y="140" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">execution_backends = (CloudRun,)</text>
        <text x="133" y="162" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">@task(execution_backend="cloudrun")</text>
        <text x="133" y="186" text-anchor="middle" fill="var(--lq-emerald)" font-size="10.5" font-family="monospace">schedules_on_enqueue=True</text>

        <line class="lq-diagram-flow" x1="251" y1="88" x2="328" y2="74" stroke="var(--lq-blue)" stroke-width="2.5" />
        <line class="lq-diagram-flow" x1="251" y1="176" x2="328" y2="190" stroke="var(--lq-violet)" stroke-width="2.5" />

        <rect x="328" y="20" width="275" height="106" rx="12" fill="var(--lq-card)" stroke="var(--lq-blue)" stroke-width="2" />
        <text x="465" y="46" text-anchor="middle" fill="var(--lq-text)" font-size="13" font-weight="700">Fast Push Lane (&lt;= 30 min)</text>
        <text x="465" y="66" text-anchor="middle" fill="var(--lq-blue)" font-size="11.5" font-family="monospace">CloudTasksExecutionBackend</text>
        <text x="465" y="88" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">Dispatches OIDC-signed HTTP POST</text>
        <text x="465" y="108" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">Schedule Horizon up to 30 days ahead</text>

        <rect x="328" y="138" width="275" height="106" rx="12" fill="var(--lq-card)" stroke="var(--lq-violet)" stroke-width="2" />
        <text x="465" y="164" text-anchor="middle" fill="var(--lq-text)" font-size="13" font-weight="700">Heavy Batch Lane (Multi-Hour)</text>
        <text x="465" y="184" text-anchor="middle" fill="var(--lq-violet)" font-size="11.5" font-family="monospace">CloudRunExecutionBackend</text>
        <text x="465" y="206" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">Calls JobsClient.run_job(overrides)</text>
        <text x="465" y="226" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">Injects QUEUES_TASK_ID env var</text>

        <line class="lq-diagram-flow" x1="603" y1="74" x2="670" y2="74" stroke="var(--lq-emerald)" stroke-width="2.5" />
        <line class="lq-diagram-flow" x1="603" y1="190" x2="670" y2="190" stroke="var(--lq-emerald)" stroke-width="2.5" />

        <rect x="670" y="20" width="234" height="106" rx="12" fill="var(--lq-card)" stroke="var(--lq-emerald)" stroke-width="2" />
        <text x="787" y="46" text-anchor="middle" fill="var(--lq-text)" font-size="13" font-weight="700">Cloud Run Service Webhook</text>
        <text x="787" y="66" text-anchor="middle" fill="var(--lq-emerald)" font-size="11" font-family="monospace">/_litestar-queues/cloud-tasks</text>
        <text x="787" y="88" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">CloudTasksOIDCGuard + claim_task</text>
        <text x="787" y="108" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">Active lease -&gt; 503; stale -&gt; reclaim</text>

        <rect x="670" y="138" width="234" height="106" rx="12" fill="var(--lq-card)" stroke="var(--lq-emerald)" stroke-width="2" />
        <text x="787" y="164" text-anchor="middle" fill="var(--lq-text)" font-size="13" font-weight="700">Cloud Run Job Execution</text>
        <text x="787" y="184" text-anchor="middle" fill="var(--lq-emerald)" font-size="11" font-family="monospace">litestar queues run-task</text>
        <text x="787" y="206" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">Dedicated CPU/RAM container</text>
        <text x="787" y="226" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">Exits 0 on complete, 1 on retry/fail</text>
      </svg>
    </div>

    <div class="lq-sls-panel lq-sls-panel--maint">
      <svg viewBox="0 0 920 245" role="img" aria-labelledby="lq-sls-mt-title lq-sls-mt-desc">
        <title id="lq-sls-mt-title">Six-Phase QueueMaintenanceService Sweep</title>
        <desc id="lq-sls-mt-desc">Ordered execution of expire, external, stale, schedules, terminal, and events phases via /_litestar-queues/maintenance or litestar queues run-maintenance.</desc>

        <rect x="14" y="34" width="136" height="175" rx="10" fill="var(--lq-card)" stroke="var(--lq-amber)" stroke-width="2" />
        <text x="82" y="64" text-anchor="middle" fill="var(--lq-amber)" font-size="12" font-weight="700" font-family="monospace">1. expire</text>
        <text x="82" y="92" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">Expire queued</text>
        <text x="82" y="110" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">tasks past</text>
        <text x="82" y="128" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">expires_at</text>
        <text x="82" y="156" text-anchor="middle" fill="var(--lq-text)" font-size="10" font-family="monospace">expire_pending</text>

        <line class="lq-diagram-flow" x1="150" y1="121" x2="166" y2="121" stroke="var(--lq-amber)" stroke-width="2" />

        <rect x="166" y="34" width="136" height="175" rx="10" fill="var(--lq-card)" stroke="var(--lq-blue)" stroke-width="2" />
        <text x="234" y="64" text-anchor="middle" fill="var(--lq-blue)" font-size="12" font-weight="700" font-family="monospace">2. external</text>
        <text x="234" y="92" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">Reconcile</text>
        <text x="234" y="110" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">Cloud Run /</text>
        <text x="234" y="128" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">Tasks refs</text>
        <text x="234" y="156" text-anchor="middle" fill="var(--lq-text)" font-size="10" font-family="monospace">reconcile_task</text>

        <line class="lq-diagram-flow" x1="302" y1="121" x2="318" y2="121" stroke="var(--lq-blue)" stroke-width="2" />

        <rect x="318" y="34" width="136" height="175" rx="10" fill="var(--lq-card)" stroke="var(--lq-rose)" stroke-width="2" />
        <text x="386" y="64" text-anchor="middle" fill="var(--lq-rose)" font-size="12" font-weight="700" font-family="monospace">3. stale</text>
        <text x="386" y="92" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">Reclaim stale</text>
        <text x="386" y="110" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">running leases</text>
        <text x="386" y="128" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">&amp; redispatch</text>
        <text x="386" y="156" text-anchor="middle" fill="var(--lq-text)" font-size="10" font-family="monospace">requeue_stale</text>

        <line class="lq-diagram-flow" x1="454" y1="121" x2="470" y2="121" stroke="var(--lq-rose)" stroke-width="2" />

        <rect x="470" y="34" width="136" height="175" rx="10" fill="var(--lq-card)" stroke="var(--lq-violet)" stroke-width="2" />
        <text x="538" y="64" text-anchor="middle" fill="var(--lq-violet)" font-size="12" font-weight="700" font-family="monospace">4. schedules</text>
        <text x="538" y="92" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">Claim due</text>
        <text x="538" y="110" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">cron/interval</text>
        <text x="538" y="128" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">&amp; enqueue</text>
        <text x="538" y="156" text-anchor="middle" fill="var(--lq-text)" font-size="10" font-family="monospace">claim_due</text>

        <line class="lq-diagram-flow" x1="606" y1="121" x2="622" y2="121" stroke="var(--lq-violet)" stroke-width="2" />

        <rect x="622" y="34" width="136" height="175" rx="10" fill="var(--lq-card)" stroke="var(--lq-emerald)" stroke-width="2" />
        <text x="690" y="64" text-anchor="middle" fill="var(--lq-emerald)" font-size="12" font-weight="700" font-family="monospace">5. terminal</text>
        <text x="690" y="92" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">Delete old</text>
        <text x="690" y="110" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">terminal rows</text>
        <text x="690" y="128" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">past retention</text>
        <text x="690" y="156" text-anchor="middle" fill="var(--lq-text)" font-size="10" font-family="monospace">cleanup_tasks</text>

        <line class="lq-diagram-flow" x1="758" y1="121" x2="774" y2="121" stroke="var(--lq-emerald)" stroke-width="2" />

        <rect x="774" y="34" width="132" height="175" rx="10" fill="var(--lq-card)" stroke="var(--lq-blue)" stroke-width="2" />
        <text x="840" y="64" text-anchor="middle" fill="var(--lq-blue)" font-size="12" font-weight="700" font-family="monospace">6. events</text>
        <text x="840" y="92" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">Prune expired</text>
        <text x="840" y="110" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">QueueEventLog</text>
        <text x="840" y="128" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">history rows</text>
        <text x="840" y="156" text-anchor="middle" fill="var(--lq-text)" font-size="10" font-family="monospace">cleanup_events</text>
      </svg>
    </div>
  </div>
</div>
