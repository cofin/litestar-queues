<div class="lq-diagram lq-diagram--events">
  <style>
    .lq-diagram--events .lq-ev-panel {
      display: none;
    }
    #lq-ev-dual:checked ~ .lq-diagram-tabs label[for="lq-ev-dual"],
    #lq-ev-replay:checked ~ .lq-diagram-tabs label[for="lq-ev-replay"] {
      border-color: var(--lq-blue);
      background: rgba(37, 99, 235, 0.12);
      color: var(--lq-blue);
    }
    #lq-ev-dual:checked ~ .lq-ev-panels .lq-ev-panel--dual,
    #lq-ev-replay:checked ~ .lq-ev-panels .lq-ev-panel--replay {
      display: block;
    }
  </style>

  <input type="radio" name="lq-events-tab" id="lq-ev-dual" checked />
  <input type="radio" name="lq-events-tab" id="lq-ev-replay" />

  <div class="lq-diagram-tabs" role="tablist" aria-label="Task Events &amp; Realtime Streams Architecture">
    <label for="lq-ev-dual">Dual-Path Commit-Before-Live Pipeline</label>
    <label for="lq-ev-replay">Cursor Replay &amp; Planned Stream Rollover</label>
  </div>

  <div class="lq-ev-panels">
    <div class="lq-ev-panel lq-ev-panel--dual">
      <svg viewBox="0 0 920 265" role="img" aria-labelledby="lq-ev-dl-title lq-ev-dl-desc">
        <title id="lq-ev-dl-title">Dual-Path Task Event Publication Pipeline</title>
        <desc id="lq-ev-dl-desc">TaskExecutionContext and Worker publish QueueEvents to QueueEventPublisher, which persists durable history before broadcasting to ChannelsQueueEventSink SSE/WebSocket streams.</desc>

        <rect x="16" y="42" width="225" height="180" rx="12" fill="var(--lq-card)" stroke="var(--lq-blue)" stroke-width="2" />
        <text x="128" y="72" text-anchor="middle" fill="var(--lq-text)" font-size="13.5" font-weight="700">Task &amp; Worker Lifecycle</text>
        <text x="128" y="96" text-anchor="middle" fill="var(--lq-blue)" font-size="11.5" font-family="monospace">TaskExecutionContext</text>
        <text x="128" y="120" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">ctx.progress(percent, stage=...)</text>
        <text x="128" y="140" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">ctx.log(message, level="info")</text>
        <text x="128" y="160" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">ctx.event(event_type, data=...)</text>
        <text x="128" y="184" text-anchor="middle" fill="var(--lq-emerald)" font-size="10.5" font-family="monospace">enqueued • started • completed</text>

        <line class="lq-diagram-flow" x1="241" y1="132" x2="306" y2="132" stroke="var(--lq-blue)" stroke-width="2.5" />

        <rect x="306" y="54" width="220" height="156" rx="12" fill="var(--lq-card)" stroke="var(--lq-amber)" stroke-width="2" />
        <text x="416" y="84" text-anchor="middle" fill="var(--lq-text)" font-size="13.5" font-weight="700">Event Coordinator</text>
        <text x="416" y="108" text-anchor="middle" fill="var(--lq-amber)" font-size="11.5" font-family="monospace">QueueEventPublisher</text>
        <text x="416" y="132" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">Commit-before-live ordering</text>
        <text x="416" y="152" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">Assigns monotonic sequence ID</text>
        <text x="416" y="174" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">delivery="background" | "strict"</text>

        <line class="lq-diagram-flow" x1="526" y1="92" x2="604" y2="73" stroke="var(--lq-amber)" stroke-width="2.5" />
        <text x="565" y="68" text-anchor="middle" fill="var(--lq-amber)" font-size="10" font-weight="600">Path A</text>

        <line class="lq-diagram-flow" x1="526" y1="172" x2="604" y2="191" stroke="var(--lq-emerald)" stroke-width="2.5" />
        <text x="565" y="198" text-anchor="middle" fill="var(--lq-emerald)" font-size="10" font-weight="600">Path B</text>

        <rect x="604" y="20" width="298" height="106" rx="12" fill="var(--lq-card)" stroke="var(--lq-amber)" stroke-width="2" />
        <text x="753" y="46" text-anchor="middle" fill="var(--lq-text)" font-size="13" font-weight="700">Durable History (QueueEventLog)</text>
        <text x="753" y="66" text-anchor="middle" fill="var(--lq-amber)" font-size="11" font-family="monospace">EventHistoryConfig(enabled=True)</text>
        <text x="753" y="88" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">Batched append_many() + stage_summaries</text>
        <text x="753" y="108" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">Query via list_events() &amp; get_task_events()</text>

        <rect x="604" y="138" width="298" height="106" rx="12" fill="var(--lq-card)" stroke="var(--lq-emerald)" stroke-width="2" />
        <text x="753" y="164" text-anchor="middle" fill="var(--lq-text)" font-size="13" font-weight="700">Live Browser Fan-Out</text>
        <text x="753" y="184" text-anchor="middle" fill="var(--lq-emerald)" font-size="11" font-family="monospace">ChannelsQueueEventSink -&gt; /queues/events</text>
        <text x="753" y="206" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">SSE (`text/event-stream`) &amp; WebSocket routes</text>
        <text x="753" y="226" text-anchor="middle" fill="var(--lq-muted)" font-size="10.5">Queue / Task / Global topic channels</text>
      </svg>
    </div>

    <div class="lq-ev-panel lq-ev-panel--replay">
      <svg viewBox="0 0 920 245" role="img" aria-labelledby="lq-ev-rp-title lq-ev-rp-desc">
        <title id="lq-ev-rp-title">Gap-Free Cursor Replay &amp; Planned Stream Rollover</title>
        <desc id="lq-ev-rp-desc">SSE and WebSocket subscribers replay missed history from Last-Event-ID or after_sequence, deduplicate live frames, and reconnect seamlessly on max_stream_duration.</desc>

        <rect x="18" y="30" width="276" height="184" rx="12" fill="var(--lq-card)" stroke="var(--lq-blue)" stroke-width="2" />
        <text x="156" y="60" text-anchor="middle" fill="var(--lq-text)" font-size="14" font-weight="700">1. Subscribe &amp; Replay</text>
        <text x="156" y="84" text-anchor="middle" fill="var(--lq-blue)" font-size="11.5" font-family="monospace">Last-Event-ID / after_sequence</text>
        <text x="156" y="112" text-anchor="middle" fill="var(--lq-muted)" font-size="11">Subscribes to live Channels topic first</text>
        <text x="156" y="134" text-anchor="middle" fill="var(--lq-muted)" font-size="11">Replays QueueEventLog(after_sequence=N)</text>
        <text x="156" y="156" text-anchor="middle" fill="var(--lq-muted)" font-size="11">Deduplicates live frames &lt;= replayed seq</text>
        <text x="156" y="182" text-anchor="middle" fill="var(--lq-blue)" font-size="11" font-family="monospace">Zero missed events on reconnect</text>

        <line class="lq-diagram-flow" x1="294" y1="122" x2="324" y2="122" stroke="var(--lq-blue)" stroke-width="2.5" />

        <rect x="324" y="30" width="272" height="184" rx="12" fill="var(--lq-card)" stroke="var(--lq-emerald)" stroke-width="2" />
        <text x="460" y="60" text-anchor="middle" fill="var(--lq-text)" font-size="14" font-weight="700">2. Planned Stream Rollover</text>
        <text x="460" y="84" text-anchor="middle" fill="var(--lq-emerald)" font-size="11.5" font-family="monospace">max_stream_duration=timedelta(...)</text>
        <text x="460" y="112" text-anchor="middle" fill="var(--lq-muted)" font-size="11">Closes cleanly before Cloud Run timeout</text>
        <text x="460" y="134" text-anchor="middle" fill="var(--lq-muted)" font-size="11">Emits `retry: &lt;retry_ms&gt;` SSE hint</text>
        <text x="460" y="156" text-anchor="middle" fill="var(--lq-muted)" font-size="11">WebSocket close code 1001 (`stream_rollover`)</text>
        <text x="460" y="182" text-anchor="middle" fill="var(--lq-emerald)" font-size="11" font-family="monospace">Browser EventSource auto-resumes</text>

        <line class="lq-diagram-flow" x1="596" y1="122" x2="626" y2="122" stroke="var(--lq-emerald)" stroke-width="2.5" />

        <rect x="626" y="30" width="276" height="184" rx="12" fill="var(--lq-card)" stroke="var(--lq-violet)" stroke-width="2" />
        <text x="764" y="60" text-anchor="middle" fill="var(--lq-text)" font-size="14" font-weight="700">3. Shielded Teardown</text>
        <text x="764" y="84" text-anchor="middle" fill="var(--lq-violet)" font-size="11.5" font-family="monospace">CancelScope(shield=True)</text>
        <text x="764" y="112" text-anchor="middle" fill="var(--lq-muted)" font-size="11">Shields subscriber cleanup on disconnect</text>
        <text x="764" y="134" text-anchor="middle" fill="var(--lq-muted)" font-size="11">Prevents leaked Channels subscriptions</text>
        <text x="764" y="156" text-anchor="middle" fill="var(--lq-muted)" font-size="11">Flushes pending EventBuffer on shutdown</text>
        <text x="764" y="182" text-anchor="middle" fill="var(--lq-violet)" font-size="11" font-family="monospace">Safe under high client churn</text>
      </svg>
    </div>
  </div>
</div>
