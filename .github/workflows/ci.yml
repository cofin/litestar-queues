name: Tests And Linting

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.2

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: make install

      - name: Execute prek
        run: uvx prek run --show-diff-on-failure --color=always --all-files

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.2

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: make install

      - name: Run mypy
        run: uv run mypy

  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.2

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: make install

      - name: Run pyright
        run: uv run pyright

  slotscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.2

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: make install

      - name: Run slotscheck
        run: uv run slotscheck src/litestar_queues/

  test_python:
    name: "test (python ${{ matrix.python-version }})"
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    uses: ./.github/workflows/test.yml
    with:
      coverage: ${{ matrix.python-version == '3.14' }}
      python-version: ${{ matrix.python-version }}
      timeout: 60

  test_server_processes:
    name: "server processes (${{ matrix.os }}, python ${{ matrix.python-version }})"
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest", "windows-latest"]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.2

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: make install

      - name: Run server process tests
        env:
          UV_PYTHON: ${{ matrix.python-version }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: >-
          uv run pytest
          src/tests/unit/test_server_worker.py
          src/tests/integration/test_server_worker_topology.py
          -q

  codecov:
    needs:
      - test_python
      - test_server_processes
      - validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-xml
          path: coverage.xml
          merge-multiple: true

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: cofin/litestar-queues

  build-docs:
    needs:
      - validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.2

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: make install

      - name: Build docs
        run: uv run make docs

      - name: Check docs links
        run: uv run make docs-linkcheck
