name: Tests And Linting

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v8.3.2

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: make install

      - name: Execute prek
        run: uvx prek run --show-diff-on-failure --color=always --all-files

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v8.3.2

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: make install

      - name: Run mypy
        run: uv run mypy

  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v8.3.2

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: make install

      - name: Run pyright
        run: uv run pyright

  slotscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v8.3.2

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: make install

      - name: Run slotscheck
        run: uv run slotscheck src/litestar_queues/

  test_python:
    name: "test (python ${{ matrix.python-version }})"
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    uses: $/.github/workflows/test.yml
    with:
      coverage: ${{ matrix.python-version == '3.14' }}
      python-version: ${{ matrix.python-version }}
      timeout: 60

  test_sqlspec_floor:
    name: "SQLSpec 0.63.0 (${{ matrix.distribution }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        distribution: [source, compiled]
    env:
      UV_PYTHON: "3.13"
      SQLSPEC_DISTRIBUTION: ${{ matrix.distribution }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v8.3.2

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev --group tests

      - name: Install exact SQLSpec distribution
        shell: bash
        run: |
          if [ "$SQLSPEC_DISTRIBUTION" = source ]; then
            uv pip install --reinstall --no-deps --no-binary sqlspec 'sqlspec==0.63.0'
          else
            uv pip install --reinstall --no-deps --only-binary sqlspec 'sqlspec==0.63.0'
          fi

      - name: Verify distribution and native SQL Server configs
        run: |
          uv run --no-sync python - <<'PY'
          import importlib.machinery
          import importlib.metadata
          import os
          import sqlspec.base
          from sqlspec.adapters.mssql_python import MssqlPythonConfig
          from sqlspec.adapters.pymssql import PymssqlConfig

          version = importlib.metadata.version("sqlspec")
          origin = sqlspec.base.__file__
          print(f"SQLSpec {version}: {origin}")
          assert version == "0.63.0", version
          compiled = any(origin.endswith(suffix) for suffix in importlib.machinery.EXTENSION_SUFFIXES)
          assert compiled == (os.environ["SQLSPEC_DISTRIBUTION"] == "compiled"), origin
          PymssqlConfig()
          MssqlPythonConfig()
          PY

      - name: Run exact-floor config and migration acceptance
        run: >-
          uv run --no-sync pytest
          src/tests/unit/backends/test_sqlspec_config.py
          src/tests/integration/backends/sqlspec/test_extension_migrations.py
          -n 0 -q

  test_server_processes:
    name: "server processes (${{ matrix.os }}, python ${{ matrix.python-version }})"
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest", "windows-latest"]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v8.3.2

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: make install

      - name: Run server process tests
        env:
          UV_PYTHON: ${{ matrix.python-version }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: >-
          uv run pytest
          src/tests/unit/test_server_worker.py
          src/tests/integration/test_server_worker_topology.py
          -q

  codecov:
    needs:
      - test_python
      - test_server_processes
      - validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-xml
          path: coverage.xml
          merge-multiple: true

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: cofin/litestar-queues

  build-docs:
    needs:
      - validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v8.3.2

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: make install

      - name: Build docs
        run: uv run make docs

      - name: Check docs links
        run: uv run make docs-linkcheck
