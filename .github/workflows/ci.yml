name: Tests And Linting

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v8.3.2

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: make install

      - name: Execute prek
        run: uvx prek run --show-diff-on-failure --color=always --all-files

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v8.3.2

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: make install

      - name: Run mypy
        run: uv run mypy

  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v8.3.2

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: make install

      - name: Run pyright
        run: uv run pyright

  slotscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v8.3.2

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: make install

      - name: Run slotscheck
        run: uv run slotscheck src/litestar_queues/

  test_python:
    name: "test (python ${{ matrix.python-version }})"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    uses: $/.github/workflows/test.yml
    with:
      allow-failure: ${{ matrix.python-version == '3.15' }}
      coverage: ${{ matrix.python-version == '3.14' }}
      python-version: ${{ matrix.python-version }}
      timeout: 60

  test_server_processes:
    name: "server processes (${{ matrix.os }}, python ${{ matrix.python-version }})"
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest", "windows-latest"]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v8.3.2

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: make install

      - name: Run server process tests
        env:
          UV_PYTHON: ${{ matrix.python-version }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: >-
          uv run pytest
          src/tests/unit/test_server_worker.py
          src/tests/integration/test_server_worker_topology.py
          -q

  codecov:
    needs:
      - test_python
      - test_server_processes
      - validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-xml
          path: coverage.xml
          merge-multiple: true

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: cofin/litestar-queues

  build-docs:
    needs:
      - validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v8.3.2

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --group docs

      - name: Build and verify docs
        run: |
          uv run python tools/docs/scan_public_docstrings.py
          uv run python tools/docs/generate_cli_docs.py --check
          uv run zensical build --clean
          uv run python tools/docs/postbuild.py
          uv run python tools/docs/verify_docs_artifacts.py --strict-warnings
